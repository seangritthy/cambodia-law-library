name: Build & Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies & Sync Capacitor
        run: |
          npm install
          mkdir -p android/app/src/main/assets/public
          cp -r src/* android/app/src/main/assets/public/
          npx cap sync android || true
          mkdir -p android/capacitor-cordova-android-plugins
          printf 'ext {\n    cdvPluginPostBuildExtras = []\n}\n' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          
          if [ ! -f "android/release-key.jks" ]; then
            keytool -genkeypair -v -keystore android/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias cambodia-law-key -storepass CambodiaLaw2026! -keypass CambodiaLaw2026! -dname "CN=Cambodia Law Library, OU=Legal Tech, O=Cambodia Law Library, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release & Debug APKs
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew assembleDebug --no-daemon --stacktrace || true

      - name: Collect APK Artifacts
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/ \;
          ls -la build-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cambodia-Law-Library-APK-${{ github.ref_name }}
          path: build-output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Cambodia Law Library ${{ github.ref_name }} Release APK
          allowUpdates: true
          body: |
            ### 📱 Cambodia Law Library (បណ្ណាល័យច្បាប់កម្ពុជា) ${{ github.ref_name }} Android Release
            
            #### 🌟 What's New in this Release:
            - 🔍 **Live Search & Category Filtering**: Instant search across titles + category pills (Codes, Laws, Royal Decrees, Sub-Decrees, Favorites).
            - ❤️ **Favorites & Last-Read Page Memory**: Save favorite laws and resume reading from where you left off.
            - 🎨 **3 Display Themes + PDF Canvas Filters**: Dark Slate, Sepia, Light Mode, and Night Invert PDF filters.
            - 📖 **Interactive 3D Page Flip & Scroll Modes**: Smooth 3D page turning animation + scroll view options.
            - 🔍 **Zoom & Direct Page Jump Modal**: Zoom from 75% to 250% and jump directly to any page.
            - 🔊 **Khmer Text-to-Speech (TTS)**: Web Speech API & fallback Khmer audio engine.
            
            #### 🔑 Signed & Package Info:
            - **Package ID**: `com.cambodia.lawlibrary`
            - **Version**: ${{ github.ref_name }}
            - **Signed**: Release Keystore (`release-key.jks`)
            
            #### 📥 Download Instructions:
            1. Download an `.apk` file below.
            2. Tap to install on your Android device.
          files: |
            build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
