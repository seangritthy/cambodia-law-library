name: Build & Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Capacitor Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r src/* android/app/src/main/assets/public/

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/CambodiaLawLibrary-v1.1.0-debug.apk || true
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/CambodiaLawLibrary-v1.1.0-signed-release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/CambodiaLawLibrary-v1.1.0-release.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cambodia-Law-Library-APK-v1.1.0
          path: build-output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: Cambodia Law Library v1.1.0 Release APK
          body: |
            ### 📱 Cambodia Law Library (បណ្ណាល័យច្បាប់កម្ពុជា) v1.1.0 Android Release
            
            #### 🌟 What's New in this Release:
            - 🔍 **Live Search & Category Filtering**: Instant search across titles + category pills (Codes, Laws, Royal Decrees, Sub-Decrees, Favorites).
            - ❤️ **Favorites & Last-Read Page Memory**: Save favorite laws and resume reading from where you left off.
            - 🎨 **3 Display Themes + PDF Canvas Filters**: Dark Slate, Sepia, Light Mode, and Night Invert PDF filters.
            - 📖 **Interactive 3D Page Flip & Scroll Modes**: Smooth 3D page turning animation + scroll view options.
            - 🔍 **Zoom & Direct Page Jump Modal**: Zoom from 75% to 250% and jump directly to any page.
            - 🔊 **Khmer Text-to-Speech (TTS)**: Web Speech API & fallback Khmer audio engine.
            
            #### 🔑 Signing & Keystore:
            - Signed with Production Release Keystore (`release-key.jks`).
            - Alias: `cambodia-law-key` | Password: `CambodiaLaw2026!`
            
            #### 📥 Download Instructions:
            1. Download `CambodiaLawLibrary-v1.1.0-signed-release.apk` or `CambodiaLawLibrary-v1.1.0-debug.apk` below.
            2. Tap to install on your Android device.
          files: |
            build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
